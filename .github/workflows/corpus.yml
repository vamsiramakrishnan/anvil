name: Corpus

on:
  schedule:
    # Nightly at 03:17 UTC, away from the top-of-hour scheduler peak.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ASTRO_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  corpus:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quick
            name: Quick differential
          - lane: estates
            name: Gateway estates
          - lane: conformance
            name: Tri-surface conformance
          - lane: legacy-estate
            name: Legacy estate
          - lane: sweep
            name: API universe sweep

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      # Each matrix lane has an isolated checkout and report directory. A red
      # corpus command remains a red job, while the always() steps below still
      # preserve its diagnostic report.
      - name: Run ${{ matrix.name }}
        env:
          CORPUS_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$CORPUS_LANE" in
            quick)
              node tools/corpus/run.mjs quick
              ;;
            estates)
              node tools/corpus/run.mjs estates
              ;;
            conformance)
              node tools/corpus/run.mjs conformance
              ;;
            legacy-estate)
              pnpm corpus:legacy
              ;;
            sweep)
              node tools/corpus/run.mjs sweep --limit 150 --seed 42
              ;;
            *)
              echo "::error::Unknown corpus lane: $CORPUS_LANE"
              exit 2
              ;;
          esac

      - name: Collect ${{ matrix.name }} report
        if: always()
        env:
          CORPUS_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          destination="corpus-reports/$CORPUS_LANE"
          mkdir -p "$destination"

          if [[ "$CORPUS_LANE" == "legacy-estate" ]]; then
            source_dir="tools/legacy-corpus/report"
            report_files=(report.json summary.md)
          else
            source_dir="tools/corpus/report"
            report_files=(report.jsonl summary.md)
          fi

          missing=0
          for report_file in "${report_files[@]}"; do
            if [[ -f "$source_dir/$report_file" ]]; then
              cp "$source_dir/$report_file" "$destination/$report_file"
            else
              echo "::error::Missing $source_dir/$report_file for $CORPUS_LANE"
              missing=1
            fi
          done

          if [[ -f "$destination/summary.md" ]]; then
            cat "$destination/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$missing"

      - name: Upload ${{ matrix.name }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-reports/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Corpus gate
    if: always()
    needs: corpus
    runs-on: ubuntu-latest
    # A red nightly job nobody watches is how four stale expected/*.json
    # fixtures sat unnoticed: the failure existed but was not VISIBLE. The gate
    # therefore files (or updates) a labeled issue on regression and closes it
    # when the corpus is green again, so a scheduled failure lands in the issue
    # tracker rather than in a run list nobody reads.
    permissions:
      issues: write
    steps:
      - name: Open or update the corpus-regression issue
        if: needs.corpus.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "corpus-regression";
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "b60205",
                description: "The scheduled corpus run regressed",
              });
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled corpus run regressed: ${runUrl}`,
              "",
              "Per-lane summaries are in that run's job summary; full reports are its",
              "`corpus-<lane>-*` artifacts. A red lane means a differential oracle",
              "(naming-differential, naming-conformance ratchet, op-count, accounting,",
              "invariants) went red on a real estate — treat it as a failing check,",
              "not background noise. See tools/corpus/README.md for what each oracle",
              "gates and how to re-record a baseline after an intentional change.",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "Scheduled corpus run regressed", labels: [label], body });
            }
      - name: Close the corpus-regression issue when green again
        if: needs.corpus.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const label = "corpus-regression";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `The corpus is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed",
              });
            }
      - name: Require every corpus lane to complete successfully
        env:
          CORPUS_RESULT: ${{ needs.corpus.result }}
        run: |
          if [[ "$CORPUS_RESULT" != "success" ]]; then
            echo "::error::One or more corpus lanes failed. Download the lane-specific artifacts from this run."
            exit 1
          fi
