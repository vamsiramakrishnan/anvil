name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  ASTRO_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

# The jobs below run at once, so a change waits for the slowest of them rather
# than for their sum. The one serial job they replace spent a median 23.5
# minutes: ~90 s of typecheck, ~7 min of tests and ~16 min of mutation gate,
# one after another. `ci-ok` is the single check a branch rule can require.
jobs:
  static:
    name: Lint, dead code, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check dead code
        run: pnpm deadcode

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANVIL_FUZZ_REQUIRE_SDKS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The SDK tests compile generated Go and Java clients.
      - name: Set up Go for SDK execution
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false

      - name: Set up Java for SDK execution
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Build before tests. Cookbook tests execute the literal, documented
      # packages/cli/dist/bin-anvil.js commands, so the distributable CLI must
      # exist before the suite starts.
      - name: Build
        run: pnpm build

      - name: Test
        # SDK compiler processes share the runner with the test workers.
        run: pnpm test --concurrency=2 -- --maxWorkers=2

      - name: Test corpus oracles, fixtures and accounting
        run: pnpm exec vitest run tools/corpus

      # This corpus is offline and deterministic, so it remains a per-change
      # gate. Network-backed corpora stay in corpus.yml.
      - name: Gateway-estate differential gate
        run: node tools/corpus/run.mjs estates

  mutation:
    name: Mutation gate ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ANVIL_FUZZ_REQUIRE_SDKS: "true"

    # The mutation runner edits source files while proving that the declared
    # tests detect each removed control, so it gets runners of its own and
    # never shares one with the normal suite. Each shard takes every fourth
    # mutant of the roster (tools/mutation/run.mjs --shard), runs the clean
    # baseline for the test sets it owns, and fails on its own survivors.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Some declared test sets compile generated Go and Java clients.
      - name: Set up Go for SDK execution
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false

      - name: Set up Java for SDK execution
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Some declared test sets spawn the built CLI, as the full suite does.
      - name: Build
        run: pnpm build

      - name: Mutation gate
        run: node tools/mutation/run.mjs --shard ${{ matrix.shard }}/4

  e2e:
    name: Console end-to-end
    runs-on: ubuntu-latest
    # Separate runners keep the browser proof independent of mutation edits and
    # report UI failures without waiting for the full workspace mutation gate.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser build is the one @playwright/test's pinned version expects;
      # the e2e config itself never installs a browser.
      - name: Install Chromium for Playwright
        run: pnpm --filter @anvil/console exec playwright install --with-deps chromium

      # The proof drives the REAL built page served by the REAL `anvil console`
      # process over a workspace the built CLI compiles, so everything builds first.
      - name: Build
        run: pnpm build

      # A separate turbo task, deliberately outside `pnpm test`, so the unit
      # suite and the mutation runner never depend on a browser.
      - name: Console end-to-end
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-report
          path: |
            packages/console/playwright-report
            packages/console/test-results
          retention-days: 7

  ci-ok:
    name: CI
    # Green only when every job above is. `!cancelled()` runs it after a
    # needed job failed, so that it fails too; skipped, it would count as
    # passed for a required check.
    if: ${{ !cancelled() }}
    needs: [static, test, mutation, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success || exit 1
          done
