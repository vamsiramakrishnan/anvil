# Microsoft Graph v1.0, SharePoint and OneDrive files, Outlook mail, Teams
# channel messages, and people, for a workplace agent.
# Compile the vendor's whole published contract under this profile:
#   curl -fsSL -o openapi.yaml https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/master/openapi/v1.0/openapi.yaml
#   anvil compile openapi.yaml --profile profile.yaml --manifest anvil.yaml --service graph --out graph
#
# The URL tracks the metadata repository's default branch, which Microsoft
# regenerates as Graph changes; a new document is refused until the difference
# is reviewed and the pin updated.
profile: graph-workplace
description: >-
  Find SharePoint sites and drives and read, search, and share drive items;
  list, read, send, and reply to Outlook mail; read and post Teams channel
  messages and replies; look up people; and run Microsoft Search (KQL) queries.
source:
  url: https://raw.githubusercontent.com/microsoftgraph/msgraph-metadata/master/openapi/v1.0/openapi.yaml
  sha256: sha256:77c1a39c94ab0a72c0a2e07ff74f221903141e8913e748fddcc189b98da42feb
select:
  # SharePoint sites and drives.
  - method: get
    path:
      - /sites
      - "/sites/{site-id}"
      - "/sites/{site-id}/drive"
      - "/sites/{site-id}/drives"
      - "/drives/{drive-id}"
      - "/drives/{drive-id}/root"
      - /me/drive
  # Drive items: read, list, search, versions, sharing.
  - method: get
    path:
      - "/drives/{drive-id}/items/{driveItem-id}"
      - "/drives/{drive-id}/items/{driveItem-id}/children"
      - "/drives/{drive-id}/items/{driveItem-id}/permissions"
      - "/drives/{drive-id}/items/{driveItem-id}/versions"
      - "/drives/{drive-id}/search(q='{q}')"
      - "/drives/{drive-id}/items/{driveItem-id}/search(q='{q}')"
  - method: post
    path:
      - "/drives/{drive-id}/items/{driveItem-id}/children"
      - "/drives/{drive-id}/items/{driveItem-id}/createLink"
  # Outlook mail.
  - method: get
    path:
      - /me/messages
      - "/me/messages/{message-id}"
      - /me/mailFolders
      - "/me/mailFolders/{mailFolder-id}/messages"
  - method: post
    path:
      - /me/sendMail
      - /me/messages
      - "/me/messages/{message-id}/send"
      - "/me/messages/{message-id}/reply"
      - "/me/messages/{message-id}/replyAll"
      - "/me/messages/{message-id}/forward"
  # Teams channel messages.
  - method: get
    path:
      - /me/joinedTeams
      - "/teams/{team-id}/channels"
      - "/teams/{team-id}/channels/{channel-id}"
      - "/teams/{team-id}/channels/{channel-id}/messages"
      - "/teams/{team-id}/channels/{channel-id}/messages/{chatMessage-id}"
      - "/teams/{team-id}/channels/{channel-id}/messages/{chatMessage-id}/replies"
  - method: post
    path:
      - "/teams/{team-id}/channels/{channel-id}/messages"
      - "/teams/{team-id}/channels/{channel-id}/messages/{chatMessage-id}/replies"
  # People.
  - method: get
    path: [/me, /me/manager, /users, "/users/{user-id}", "/users/{user-id}/manager"]
  # Microsoft Search: KQL across mail, files, sites, and messages.
  - method: post
    path: /search/query
unexposed: skip
