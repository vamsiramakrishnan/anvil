# October 30 Usage Metering addition: this endpoint decides an existing
# temporary grant request. `decision` is its method payload, not its resource.
# Routing names only: keep the inferred mutation, approval and retry posture.
service:
  name: datadog
operations:
  UpdateTemporaryGrantRequest:
    name: { resource: temporary_grant_request, verb: decide }
  # November 6 RUM Recovery addition: POST estimates a session count; `recover`
  # is a path namespace, not the resource. Keep the existing canonical/MCP name
  # and stable ID. Naming alone must not change effects or the AND-auth block.
  GetRUMRecoverySessionCount:
    name: { resource: rum_recovery_session_count, verb: get }
