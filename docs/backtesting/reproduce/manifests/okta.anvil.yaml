# Supplemental Anvil manifest for the Okta Management backtest. The published
# contract is compiled whole; nothing here approves an operation.
#
# A federated claim's `expression` body field is an Okta Expression Language
# program evaluated server-side: an unconstrained query-language carrier. The
# compiler blocks both writes as query-language passthroughs, and no
# `query_policy` dialect guards that grammar, so the reviewed decision is to
# keep them blocked. Declaring it here acknowledges the finding; the operations
# stay blocked and are never exposed.
service:
  name: okta
  display_name: Okta Management API
  owner: backtesting
  environment: prod
operations:
  createFederatedClaim: { state: blocked }
  replaceFederatedClaim: { state: blocked }
  # Added in upstream 5cf2dc4 (2026-10-27). The path abbreviates applications
  # as apps; use the domain noun declared by the operationId, summary and tag.
  getApplicationsCsvExport:
    name: { resource: application, verb: export_csv }
  listApplicationsBySearch:
    name: { resource: application, verb: search }
  # These lifecycle paths name methods, not resources called promote/rollback.
  # The name axis changes routing only: effects, approval and idempotency stay
  # inferred. In particular, restoring a live policy remains a gated mutation.
  previewPolicyBranchPromotion:
    name: { resource: policy_branch_promotion, verb: preview }
  restoreFromHistory:
    name: { resource: policy_branch, verb: restore }
